name: skin-classifier
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Deep learning — CPU build for compatibility; replace with pytorch-cuda
  # for GPU training: conda install pytorch torchvision pytorch-cuda=12.1 -c pytorch -c nvidia
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - cpuonly

  # Data science
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - pillow>=9.5.0
  - pyyaml>=6.0

  # Development tools
  - pytest>=7.0
  - flake8>=6.0

  # pip-only packages (not available on conda-forge)
  - pip:
    - albumentations>=1.3.0
    - pytest-cov>=4.0
